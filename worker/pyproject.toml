[project]
name = "bcp-worker"
version = "0.1.0"
description = "Balls & Chunk Studio worker — AI plays (media decomposition) + copy generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7"]

[tool.ruff]
line-length = 100
