{% extends 'public/base.html' %}
{% load static %}
{% block title %}Watch — Balls &amp; Chunk{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
  <h3 class="text-white mb-0">Channels</h3>
</div>

<div class="row">
  {% for c in channels %}
  <div class="col-xl-4 col-md-6 mb-4">
    <div class="card h-100">
      <a href="{% url 'studio:watch_channel' c.slug %}" class="text-decoration-none">
        <div style="height:140px;background:{% if c.banner_url %}center/cover no-repeat url('{{ c.banner_url }}'){% else %}linear-gradient(135deg,#6d28d9,#2563eb){% endif %};border-radius:.5rem .5rem 0 0"></div>
      </a>
      <div class="card-body">
        <h5 class="mb-1"><a href="{% url 'studio:watch_channel' c.slug %}" class="text-white text-decoration-none">{{ c.name }}</a></h5>
        <p class="text-white-50 mb-0">{{ c.description|truncatechars:120|default:"No description yet." }}</p>
      </div>
    </div>
  </div>
  {% empty %}
  <div class="col-12"><div class="card"><div class="card-body text-center text-white-50 py-5">No channels yet.</div></div></div>
  {% endfor %}
</div>
{% endblock %}
