services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bcp
      POSTGRES_PASSWORD: bcp
      POSTGRES_DB: bcp_studio
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcp"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Uncomment to use Postgres (else the app falls back to SQLite):
      # DATABASE_URL: postgresql://bcp:bcp@db:5432/bcp_studio
      DJANGO_DEBUG: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

volumes:
  db_data:
  media_data:
